<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TAPD Helper</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <div class="header">
      <span class="logo"><svg viewBox="0 0 24 24" width="22" height="22" fill="#4a9eff"><path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-2.98 0-5.4-2.42-5.4-5.4 0-1.81.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z"/></svg></span>
      <span class="title">TAPD Helper</span>
    </div>

    <div class="toggle-row">
      <span class="label">暗色模式</span>
      <label class="switch">
        <input type="checkbox" id="dark-toggle">
        <span class="slider"></span>
      </label>
    </div>

    <div class="toggle-row">
      <span class="label">跟随系统</span>
      <label class="switch switch-sm">
        <input type="checkbox" id="follow-system">
        <span class="slider"></span>
      </label>
    </div>

    <div class="separator"></div>

    <div class="setting-row">
      <span class="label">亮度</span>
      <input type="range" id="brightness" min="-100" max="100" value="0">
      <span class="value" id="brightness-val">0</span>
    </div>

    <div class="setting-row">
      <span class="label">对比度</span>
      <input type="range" id="contrast" min="-100" max="100" value="0">
      <span class="value" id="contrast-val">0</span>
    </div>

    <div class="setting-row">
      <span class="label">色温</span>
      <input type="range" id="temperature" min="-100" max="100" value="0">
      <span class="value" id="temperature-val">0</span>
    </div>

    <div class="separator"></div>

    <a class="options-link" href="#" id="open-options">高级设置 →</a>
    <div class="footer">
      <span class="version">v1.0.0</span>
      <span class="status" id="status-indicator">已加载</span>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
